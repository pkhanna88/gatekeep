[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "apps/console", "sdk/typescript"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
# Resolved the collision the earlier note predicted: only the control plane is
# `app`. The other services use distinct package names (token_service,
# pep_proxy, mock_salesforce) and import shared code from `app`. See
# docs/DECISIONS.md.
pythonpath = [
  "services/control-plane",
  "services/token-service",
  "services/pep-proxy",
  "services/mock-salesforce",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
