# Gatekeep — Day 0 practice stack
#
# The five infrastructure services from the Day 1 INF task. No application
# services (control-plane / token-service / pep-proxy / console) — those do not
# exist yet. This exists so you can complete Appendix A's comprehension items
# before the repo exists.
#
#   docker compose up -d
#   docker compose ps        # wait for keycloak + openfga to be healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gatekeep
      POSTGRES_PASSWORD: gatekeep
      POSTGRES_DB: gatekeep
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeep -d gatekeep"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # See README "Issuer mismatch" — this is §3.3's first pitfall.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"   # http
      - "9000:9000"   # management / health
    healthcheck:
      # The Keycloak image ships no curl or wget, so we use bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  openfga:
    # PINNED. `latest` is not a version - it silently changes under you, and
    # a security product with floating versions is not a security product.
    # Bump deliberately, and note the reason in docs/DECISIONS.md.
    image: openfga/openfga:v1.14.0
    command: run
    environment:
      # Memory engine: dev only, and it forgets everything on restart.
      # That is fine here because `make seed` is the source of truth.
      OPENFGA_DATASTORE_ENGINE: memory
      # info, not warn: the startup banner prints the resolved config, which is
      # how the playground port mismatch below was finally spotted. Silencing it
      # costs more debugging time than the noise saves.
      OPENFGA_LOG_LEVEL: info
      # DISABLED. The built-in playground cannot work in any current browser,
      # and this is not a misconfiguration we can fix.
      #
      # /playground is a tiny page wrapping an iframe to the REMOTE site
      # play.fga.dev. That public page then has to call our API on 127.0.0.1,
      # and every engine now refuses to let a public site reach the loopback
      # address space. Verified on all three, September 2026:
      #
      #   Chrome   "Permission was denied for this request to access the
      #             `loopback` address space"
      #   WebKit   "Not allowed to request resource"
      #   Firefox  NS_ERROR_LOCAL_NETWORK_ACCESS_DENIED
      #
      # Not fixable from our side either. The documented opt-in is for the
      # server to send Access-Control-Allow-Private-Network; that was tested
      # with a proxy that does send it, and all three engines still refused
      # (Chrome ERR_FAILED, WebKit no request at all, Firefox
      # NS_BINDING_ABORTED). Browsers have moved past header-based opt-in to
      # blocking outright. The only other route is telling engineers to switch
      # off a browser security feature, which is not something we are going to
      # do while building a security product.
      #
      # It is also deprecated upstream, and it puts the API token in a URL
      # handed to a third-party origin - the shape of CVE-2026-40293.
      #
      # Replacement policy tooling arrives with the policy model work. Until
      # then, exercises/fga_check.py answers checks from the command line.
      OPENFGA_PLAYGROUND_ENABLED: "false"
      # Container ports deliberately match the ports we publish.
      #
      # This started as a playground fix. OpenFGA advertises its own address to
      # clients, built from whatever port it is listening on INSIDE the
      # container, so the natural mapping "8081:8080" made it tell browsers to
      # call 127.0.0.1:8080 — which on this host is Keycloak. That cost real
      # debugging time before anyone noticed the port in the error.
      #
      # The playground is disabled now for an unrelated reason (see above), but
      # keeping inside and outside identical stays worth it: anything OpenFGA
      # says about where to reach it is then also true from the host. Host
      # addresses are unchanged — 8081 http, 8082 grpc.
      OPENFGA_HTTP_ADDR: "0.0.0.0:8081"
      OPENFGA_GRPC_ADDR: "0.0.0.0:8082"
    ports:
      - "8081:8081"   # http  — handbook §3.10 assigns openfga to host 8081
      - "8082:8082"   # grpc
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8082"]
      interval: 5s
      timeout: 10s
      retries: 20

  openbao:
    image: openbao/openbao:2.4.3
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_ADDR: http://127.0.0.1:8200
    cap_add: ["IPC_LOCK"]
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
