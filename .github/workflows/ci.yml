name: CI

# Runs on every push and every pull request. The important job is `stack`:
# it starts the whole thing from a clean checkout on a machine nobody has
# ever touched. If that passes, "it works on my machine" stops being a
# thing anyone can say.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check .
      - name: Check for lint errors
        run: ruff check .
      - name: Reject unverified JWT decoding outside exercises
        # Section 9.2 asks for this in code review. A grep is cheaper and
        # never forgets.
        run: |
          if grep -rn --include='*.py' \
               -e 'verify=False' -e 'verify_signature.*False' \
               services/ tools/ sdk/python/ 2>/dev/null; then
            echo "::error::Unverified JWT decoding found on a service path"
            exit 1
          fi
          echo "Clean."

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling and service dependencies
        run: |
          pip install -r requirements-dev.txt
          for r in services/*/requirements.txt; do
            [ -f "$r" ] && pip install -r "$r"
          done

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for everything to report healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' \
                        | grep -v ' healthy$' | wc -l)
            if [ "$unhealthy" -eq 0 ]; then
              echo "All services healthy after ${i}0s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Services did not become healthy in 10 minutes"
          docker compose ps
          exit 1

      - name: Apply the database schema
        # The audit chain tests need audit_events and the gatekeep_app role.
        run: python services/control-plane/migrations/apply.py

      - name: Seed the policy model and the signing key
        # Day 3 + Day 6. Without this the stack is up but empty, and `up`
        # proving nothing is exactly the failure this job exists to catch.
        run: python deploy/seed/seed.py

      - name: Start the application services
        # Control plane, token service, PEP and mock Salesforce, on the host so
        # every token agrees on `localhost`. The runner waits for /healthz.
        run: |
          nohup python tools/run_services.py > services.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "All four services up" services.log && exit 0
            sleep 1
          done
          cat services.log
          exit 1

      - name: Run the tests
        run: pytest tests/ -v

      - name: Run the end-to-end demo non-interactively
        run: python tools/demo.py --brief

      - name: Service logs
        if: always()
        run: cat services.log || true

      - name: Run the Week 1 demo
        # Section 3.10: any manual step that is not scripted will be forgotten
        # and will break a demo. This one asserts every beat and exits non-zero,
        # so it cannot quietly stop working between rehearsals.
        run: NO_COLOR=1 python tools/week1_demo.py

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
